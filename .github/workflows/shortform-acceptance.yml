name: Short Form Isolated Acceptance
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: shortform
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: shortform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortform" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://shortform:localtest@localhost:5432/shortform?schema=public
      REDIS_URL: redis://localhost:6379
      DEEPSEEK_API_KEY: mock_for_dev
      ELEVENLABS_KEY: mock_for_dev
      VERTEX_KEY: mock_for_dev
      NEXT_PUBLIC_APP_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm ci --no-audit --no-fund
      - run: npx prisma db push --skip-generate
      - run: npx prisma generate
      - run: npx tsx src/lib/seed.ts
      - name: Execute real isolated pipeline; no paid credentials
        run: npx tsx scripts/acceptance.ts
